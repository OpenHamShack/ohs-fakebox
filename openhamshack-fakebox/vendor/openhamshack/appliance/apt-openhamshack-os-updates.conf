// OpenHamShack: Debian security updates, run by openhamshack-os-update from its own
// timer, never by Debian's apt-daily timers, which know nothing of a box
// being on air. Installed as /etc/apt/apt.conf.d/52openhamshack-os-updates.

// Only these two origins. -security is the point; -updates carries the few
// fixes the stable release managers judge too urgent to wait for the next
// point release (tzdata, ca-certificates, regressions) and is as cautious.
// Point releases themselves land in plain "trixie" and are left for a new
// OpenHamShack image, or a person, to take. A list in apt's configuration is
// added to by every file that names it, and Debian's 50unattended-upgrades
// lists plain "trixie" too - so it is cleared first, or point releases
// would come in after all (found by apt-config dump on a built image).
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
        "origin=Debian,codename=${distro_codename}-updates";
};

// The operator restarts, from the console, when no contact is under way.
Unattended-Upgrade::Automatic-Reboot "false";
// Small steps, so that a shutdown or power cut part way through leaves a
// consistent system.
Unattended-Upgrade::MinimalSteps "true";
// A box on a laptop's battery still needs patching; the job runs at idle
// priority, and only when nothing is on air.
Unattended-Upgrade::OnlyOnACPower "false";
// apt keeps the running kernel and the newest one; older ones go, or a
// small disk fills with a kernel a month.
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
// Never stop at a configuration-file question: keep the box's own file.
Dpkg::Options {
        "--force-confdef";
        "--force-confold";
};

// Debian's own timers would otherwise run unattended-upgrades on their own
// schedule, on air or not.
APT::Periodic::Update-Package-Lists "0";
APT::Periodic::Unattended-Upgrade "0";

// About 2 Mbit/s: a box may be on 4G or a club's shared line. A kernel
// (some 100 MB) then takes several minutes, which nobody is waiting for.
Acquire::http::Dl-Limit "256";
