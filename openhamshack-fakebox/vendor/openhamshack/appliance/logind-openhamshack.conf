# OpenHamShack on a laptop: closing the lid must not suspend it - a box asleep
# drops a transmission mid-over and stops receiving. Installed as
# /etc/systemd/logind.conf.d/50-openhamshack.conf.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
