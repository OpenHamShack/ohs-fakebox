# Receive picture: tap or click it, and the daemon decides what that means
# (tap_picture). On a TV it toggles this mpv's full screen, as a tap always
# did. On a one-screen box the console places the picture (screens.py): a tap
# in Split goes to Picture, and in Picture brings back the bar the console
# hides after a while - mpv's own full screen there would cover the console
# with no way back. With several receivers, the tapped receiver is heard and
# fills the picture's place, and a second tap goes back to the grid. The
# picture names itself by its IPC socket, which mpv expands here.
MBTN_LEFT run "/usr/bin/curl" "-s" "-X" "POST" "-H" "Content-Type: application/json" "-d" "{\"sock\":\"${input-ipc-server}\"}" "http://127.0.0.1:8080/api/rx/tap"
# Double-tap: Picture and Split in turn on a one-screen box.
MBTN_LEFT_DBL run "/usr/bin/curl" "-s" "-X" "POST" "http://127.0.0.1:8080/api/screens/toggle"
# A keyboard on the box, with the picture focused (a click on it focuses it):
# Esc leaves Picture, F goes between Picture and Split - the same keys the
# console takes when it has the focus. mpv's own f (full screen) and Esc
# would otherwise leave the console behind a picture with no bar.
ESC run "/usr/bin/curl" "-s" "-X" "POST" "-H" "Content-Type: application/json" "-d" "{\"mode\":\"split\"}" "http://127.0.0.1:8080/api/screens/mode"
f run "/usr/bin/curl" "-s" "-X" "POST" "-H" "Content-Type: application/json" "-d" "{\"mode\":\"toggle\"}" "http://127.0.0.1:8080/api/screens/mode"
